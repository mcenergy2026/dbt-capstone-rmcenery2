version: 2

models:
  - name: stg_classic_models__product_lines
    description: Product line staging model with descriptive content and source sync metadata from `classic_models.product_lines`.
    columns:
      - name: product_line
        description: Primary key for each product line.
        data_tests:
          - unique
          - not_null
      - name: text_description
        description: Plain-text description of the product line.
      - name: html_description
        description: HTML-formatted description of the product line.
      - name: image
        description: Image or binary asset associated with the product line.
      - name: _sync_date
        description: Timestamp when the record was last synchronized from the source system.
