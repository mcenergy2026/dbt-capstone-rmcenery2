version: 2

models:
  - name: stg_classic_models__order_details
    description: Order line staging model with product-level quantities, pricing, extended amount, and source sync metadata from `classic_models.order_details`.
    columns:
      - name: order_number
        description: Order header this line belongs to.
      - name: product_code
        description: Product code for the ordered item.
      - name: quantity_ordered
        description: Quantity ordered on the line.
      - name: price_each
        description: Unit price charged for the line item.
      - name: order_line_number
        description: Line number within the order.
      - name: line_amount
        description: Extended line amount calculated as `quantity_ordered * price_each`.
      - name: _sync_date
        description: Timestamp when the record was last synchronized from the source system.
