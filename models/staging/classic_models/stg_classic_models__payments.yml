version: 2

models:
  - name: stg_classic_models__payments
    description: Payment staging model with customer payment details and source sync metadata from `classic_models.payments`.
    columns:
      - name: customer_number
        description: Customer who made the payment.
      - name: check_number
        description: Payment reference or check identifier.
      - name: payment_date
        description: Date the payment was received.
      - name: amount
        description: Payment amount received from the customer.
      - name: _sync_date
        description: Timestamp when the record was last synchronized from the source system.
