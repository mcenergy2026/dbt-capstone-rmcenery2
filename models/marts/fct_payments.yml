version: 2

models:
  - name: fct_payments
    description: Payment fact model at one row per customer payment for downstream reporting and analytics.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - CUSTOMER_PK
              - check_number
    columns:
      - name: CUSTOMER_PK
        description: Customer primary key associated with the payment.
      - name: check_number
        description: Payment reference or check identifier.
      - name: payment_date
        description: Date the payment was received.
      - name: amount
        description: Payment amount received from the customer.
